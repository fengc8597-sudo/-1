# GitLab CI 配置（GitHub Actions 之外的另一套流水线）
# 若项目由 GitLab 托管，将本文件提交到仓库根目录即可触发。
#
# 注意：ci.yml 的 mcp<2 锁定同样适用于本流水线；
# 请复用在 requirements.txt / pyproject.toml 中的依赖声明。

image: python:3.11

stages:
  - test

before_script:
  - python -m pip install --upgrade pip
  - pip install -r requirements.txt pytest ruff pytest-cov

test:
  stage: test
  script:
    - python -m compileall -q jira_assistant
    - ruff check jira_assistant tests
    - PYTHONPATH=. pytest --cov=jira_assistant --cov-report=term-missing --cov-report=xml --cov-fail-under=80
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  coverage: '/TOTAL.*\s+(\d+%)/'