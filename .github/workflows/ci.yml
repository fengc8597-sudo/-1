name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff pytest-cov

      - name: Compile check
        run: python -m compileall -q jira_assistant

      - name: Lint (ruff)
        run: ruff check jira_assistant tests

      - name: Run tests with coverage
        run: PYTHONPATH=. pytest --cov=jira_assistant --cov-report=term-missing --cov-fail-under=80

      # 依赖/安全扫描（可选开关）
      - name: Scan dependencies (optional)
        run: |
          pip install pip-audit || true
          pip-audit -r requirements.txt || echo "pip-audit 未通过（可人工复核）"
        continue-on-error: true